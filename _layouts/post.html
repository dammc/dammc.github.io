---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">Essay</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    {% if page.description %}
      <p class="post-deck">{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
